<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../src/"><script>window.__TAURI__={core:{invoke:async()=>await (await fetch("../mock/stats.json")).json()}};</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhentUsage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="crumb">Usage <span class="sep">/</span> <b>All environments</b> <span class="range-label" id="rangeLabel"></span></div>
    <div class="controls">
      <div class="seg" id="metric">
        <button data-v="cost">Cost</button>
        <button data-v="tokens" class="on">Tokens</button>
        <button data-v="limits">Limits</button>
      </div>
      <div class="seg" id="range">
        <button data-v="1">Past 24h</button>
        <button data-v="7">7 days</button>
        <button data-v="30">30 days</button>
        <button data-v="90" class="on">90 days</button>
      </div>
      <button id="refresh" class="icon" title="Refresh">&#8635;</button>
    </div>
  </header>

  <main id="limitsView" hidden></main>

  <main id="dash">
    <section class="left">
      <div class="hero">
        <div id="bigTotal" class="big">—</div>
        <div id="bigSub" class="sub">&nbsp;</div>
      </div>
      <ul id="agentList" class="agents"></ul>

      <h3>Totals</h3>
      <div id="totals" class="totals"></div>

      <h3>Tokens by type</h3>
      <div class="stacked" id="stacked"></div>
      <div id="stackLegend" class="legend"></div>

      <div class="breakdown-head">
        <h3>Breakdown</h3>
        <div class="seg small" id="breakMode">
          <button data-v="model" class="on">Model</button>
          <button data-v="day">Day</button>
        </div>
      </div>
      <table id="breakdown"></table>
    </section>

    <section class="right">
      <h3 id="chartTitle">Daily processed tokens</h3>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <footer>
    <span id="status">loading…</span>
    <span id="priceinfo"></span>
  </footer>
  <script src="main.js"></script>
</body>
</html>
