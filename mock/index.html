<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../src/"><script>window.__TAURI__={core:{invoke:async()=>await (await fetch("../mock/stats.json")).json()}};</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="crumb" id="crumb"></div>
    <div class="controls">
      <div class="seg" id="view">
        <button data-v="usage" class="on">Usage</button>
        <button data-v="limits">Limits</button>
      </div>
      <div class="seg" id="metric">
        <button data-v="cost">Cost</button>
        <button data-v="tokens" class="on">Tokens</button>
        <button data-v="requests">Requests</button>
      </div>
      <div class="seg" id="range">
        <button data-v="1" title="UTC calendar day">Today</button>
        <button data-v="7">7 days</button>
        <button data-v="30">30 days</button>
        <button data-v="90" class="on">90 days</button>
        <button data-v="0">All time</button>
      </div>
      <button id="refresh" class="icon" title="Refresh">&#8635;</button>
    </div>
  </header>

  <main id="limitsView" hidden></main>

  <main id="dash">
    <section class="hero">
      <div id="bigTotal" class="big">—</div>
      <div id="bigSub" class="sub">&nbsp;</div>
      <div id="bigDelta" class="delta"></div>
    </section>

    <section class="left">
      <div id="agentList" class="agents"></div>

      <h3>Totals</h3>
      <div id="totals" class="totals"></div>

      <h3>Tokens by type</h3>
      <div class="stacked" id="stacked"></div>
      <div id="stackLegend" class="legend"></div>

      <div class="breakdown-head">
        <h3>Breakdown</h3>
        <div class="breakdown-tools">
          <div class="seg small" id="breakMode">
            <button data-v="model" class="on">Model</button>
            <button data-v="day">Day</button>
            <button data-v="agent">Agent</button>
            <button data-v="cache">Cache</button>
          </div>
          <button id="exportBtn" class="mini-btn" title="Export as CSV">CSV</button>
        </div>
      </div>
      <div id="breakdown" class="bd"></div>
    </section>

    <section class="right">
      <h3 id="chartTitle">Daily processed tokens</h3>
      <div id="chartLegend" class="chart-legend"></div>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <footer>
    <div class="footer-left">
      <span id="status">loading…</span>
    </div>
    <span id="priceinfo"></span>
    <div class="footer-right"></div>
  </footer>
  <script src="main.js"></script>
</body>
</html>
